<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Student Wellness</title>

    <link rel="stylesheet" href="auth.css">

    <link rel="stylesheet" href="theme.css">

</head>


<body>

    <main class="auth-container">

        <div class="auth-card">

            <div class="logo">
                🧠
            </div>

            <h1>Welcome back</h1>

            <p class="auth-subtitle">
                Sign in to continue to your wellness space.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Login
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>


            <p class="switch-page">

                Don't have an account?

                <a href="register.html">
                    Create one
                </a>

            </p>


            <a
                href="index.html"
                class="back-link"
            >
                ← Back to home
            </a>

        </div>

    </main>


    <script src="auth.js"></script>

    <script src="theme.js"></script>

</body>

</html>
